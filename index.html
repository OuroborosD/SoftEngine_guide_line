<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SoftTrack — desenvolvimento sob controle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><div class="brand"><span>◈</span> SoftTrack</div><select id="projectSelect" aria-label="Projeto atual"></select><button id="newProjectBtn" class="ghost">+ Projeto</button><div class="header-actions"><button id="newItemBtn">+ Novo item</button><button id="exportProjectBtn" class="ghost">Exportar projeto</button><button id="exportAllBtn" class="ghost">Exportar tudo</button><label class="ghost import">Importar<input id="importInput" type="file" accept="application/json,.json" hidden></label><button id="clearBtn" class="danger ghost">Limpar dados</button></div></header>
  <main><section class="project-head"><div><p class="eyebrow">VISÃO DO PROJETO</p><h1 id="projectName">Meu App</h1><button id="renameProjectBtn" class="text-button">Renomear</button> <button id="deleteProjectBtn" class="text-button danger">Excluir</button></div><div class="progress-wrap"><div class="progress-label"><strong id="progressPercent">0%</strong> concluído</div><div class="progress"><span id="progressBar"></span></div></div></section>
  <nav id="views" class="tabs"><button data-view="board" class="active">Quadro</button><button data-view="missing">O que falta <span id="missingCount" class="badge"></span></button><button data-view="bugs">Bugs</button><button data-view="tests">Testes</button><button data-view="summary">Resumo</button></nav>
  <section class="toolbar"><div id="filters" class="filter-group"><button data-filter="all" class="active">Todos</button><button data-filter="Funcionalidade">Funcionalidades</button><button data-filter="Bug">Bugs</button><button data-filter="Teste">Testes</button><button data-filter="blocked">Bloqueados</button><button data-filter="high">Alta prioridade</button></div><label class="search">⌕ <input id="searchInput" placeholder="Buscar itens..."></label></section>
  <section id="content"></section></main>
  <dialog id="itemDialog"><form id="itemForm" method="dialog"><div class="modal-head"><h2 id="modalTitle">Novo item</h2><button type="button" class="close" data-close>×</button></div><input id="itemId" type="hidden"><div class="form-grid"><label>Título<input id="title" required maxlength="120" placeholder="Ex.: Criar autenticação"></label><label>Tipo<select id="type"></select></label><label>Prioridade<select id="priority"></select></label><label>Estado<select id="status"></select></label></div><label>Descrição<textarea id="description" rows="3" placeholder="Contexto e critérios importantes"></textarea></label><label>Tags <small>(separadas por vírgula)</small><input id="tags" placeholder="frontend, segurança"></label><label>Item relacionado<select id="relatedId"><option value="">Nenhum</option></select></label><label class="checkline"><input id="blocked" type="checkbox"> Item bloqueado</label><label id="blockReasonWrap">Motivo do bloqueio<input id="blockReason" placeholder="O que está impedindo o avanço?"></label><label>Observações<textarea id="notes" rows="2"></textarea></label><section class="checklist-section"><div class="section-label">Checklist <button type="button" id="addChecklistBtn" class="text-button">+ adicionar</button></div><div id="checklistFields"></div></section><section id="relatedSection" class="related-section"></section><div class="modal-actions"><button type="button" id="deleteItemBtn" class="danger ghost">Excluir item</button><span></span><button type="button" class="ghost" data-close>Cancelar</button><button id="saveItemBtn" value="default">Salvar</button></div></form></dialog>
  <dialog id="projectDialog"><form id="projectForm" method="dialog"><div class="modal-head"><h2>Novo projeto</h2><button type="button" class="close" data-close>×</button></div><label>Nome do projeto<input id="newProjectName" required maxlength="80" placeholder="Ex.: Meu SaaS"></label><div class="modal-actions"><span></span><button type="button" class="ghost" data-close>Cancelar</button><button value="default">Criar projeto</button></div></form></dialog>
  <dialog id="importDialog"><form id="importForm" method="dialog"><div class="modal-head"><h2>Importar dados</h2><button type="button" class="close" data-close>×</button></div><p id="importInfo"></p><label>Como importar<select id="importMode"><option value="merge">Adicionar aos projetos existentes</option><option value="replace">Substituir todos os dados locais</option></select></label><div class="modal-actions"><span></span><button type="button" class="ghost" data-close>Cancelar</button><button value="default">Importar</button></div></form></dialog>
  <div id="toast" role="status"></div><script src="app.js"></script>
</body></html>
