<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SoftTrack — desenvolvimento sob controle</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c8cff'/%3E%3Cpath d='M9 11h14v3H9zm0 7h9v3H9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="extras.css">
</head>
<body>
  <header class="topbar"><div class="brand"><span>◈</span> SoftTrack</div><select id="projectSelect" aria-label="Projeto atual"></select><button id="newProjectBtn" class="ghost">+ Projeto</button><button id="backupIndicator" class="backup-indicator" type="button" aria-label="Abrir configurações de backup">Backup</button><div class="header-actions"><button id="newItemBtn">+ Novo item</button><button id="exportProjectBtn" class="ghost">Exportar projeto</button><button id="exportAllBtn" class="ghost">Exportar tudo</button><label class="ghost import">Importar<input id="importInput" type="file" accept="application/json,.json" hidden></label><button id="clearBtn" class="danger ghost">Limpar dados</button></div></header>
  <main><section class="project-head"><div><p class="eyebrow">VISÃO DO PROJETO</p><h1 id="projectName">Meu App</h1><button id="renameProjectBtn" class="text-button">Renomear</button> <button id="deleteProjectBtn" class="text-button danger">Excluir</button></div><div class="progress-wrap"><div class="progress-label"><strong id="progressPercent">0%</strong> concluído</div><div class="progress"><span id="progressBar"></span></div></div></section>
  <nav id="views" class="tabs"><button data-view="board" class="active">Quadro</button><button data-view="missing">O que falta <span id="missingCount" class="badge"></span></button><button data-view="bugs">Bugs</button><button data-view="tests">Testes</button><button data-view="summary">Resumo</button><button data-view="settings">⚙ Configurações</button></nav>
  <section class="toolbar"><div id="filters" class="filter-group"><button data-filter="all" class="active">Todos</button><button data-filter="Funcionalidade">Funcionalidades</button><button data-filter="Bug">Bugs</button><button data-filter="Teste">Testes</button><button data-filter="blocked">Bloqueados</button><button data-filter="high">Alta prioridade</button></div><label class="search">⌕ <input id="searchInput" placeholder="Buscar itens..."></label></section>
  <section id="content"></section></main>
  <dialog id="itemDialog"><form id="itemForm" method="dialog"><div class="modal-head"><h2 id="modalTitle">Novo item</h2><button type="button" class="close" data-close>×</button></div><input id="itemId" type="hidden"><div class="form-grid"><label>Título<input id="title" required maxlength="120" placeholder="Ex.: Criar autenticação"></label><label>Tipo <button type="button" class="help" data-help="Classifica o trabalho. Use Funcionalidade para algo que o usuário percebe; Bug para um comportamento incorreto." aria-label="Ajuda sobre tipo">ⓘ</button><select id="type"></select></label><label>Prioridade <button type="button" class="help" data-help="Indica urgência e impacto. Use Crítica quando o sistema não puder operar; Alta para algo importante que precisa de atenção breve." aria-label="Ajuda sobre prioridade">ⓘ</button><select id="priority"></select></label><label>Estado <button type="button" class="help" data-help="Mostra em que etapa o item está. Cada coluna do quadro representa uma fase do fluxo de desenvolvimento." aria-label="Ajuda sobre estado">ⓘ</button><select id="status"></select></label></div><label>Descrição <button type="button" class="help" data-help="Registre o contexto geral do item e informações úteis para entender o trabalho." aria-label="Ajuda sobre descrição">ⓘ</button><textarea id="description" rows="3" placeholder="Contexto e informações gerais do item"></textarea></label><label>Tags <button type="button" class="help" data-help="Rótulos para agrupar ou encontrar itens, como frontend, segurança ou checkout." aria-label="Ajuda sobre tags">ⓘ</button><small>(separadas por vírgula)</small><input id="tags" placeholder="frontend, segurança"></label><label>Item relacionado <button type="button" class="help" data-help="Vincula este trabalho a uma funcionalidade ou pendência principal, facilitando acompanhar o que ainda falta nela.">ⓘ</button><select id="relatedId"><option value="">Nenhum</option></select></label><label class="checkline"><input id="blocked" type="checkbox"> Item bloqueado <button type="button" class="help" data-help="Marque quando o item não puder avançar por uma dependência, problema ou informação ausente. Informe o motivo.">ⓘ</button></label><label id="blockReasonWrap">Motivo do bloqueio<input id="blockReason" placeholder="O que está impedindo o avanço?"></label><label>Observações<textarea id="notes" rows="2"></textarea></label><section class="checklist-section"><div class="section-label">Checklist <button type="button" class="help" data-help="Divida o trabalho em itens claros. Use as instruções para registrar o problema, o que precisa ser feito e detalhes importantes.">ⓘ</button><button type="button" id="addChecklistBtn" class="text-button">+ adicionar</button></div><div id="checklistFields"></div></section><section id="warningsSection" class="related-section"></section><section id="relatedSection" class="related-section"></section><div class="modal-actions"><button type="button" id="deleteItemBtn" class="danger ghost">Excluir item</button><button type="button" id="copyItemPromptBtn" class="ghost">Copiar para IA</button><span></span><button type="button" class="ghost" data-close>Cancelar</button><button id="saveItemBtn" value="default">Salvar</button></div></form></dialog>
  <dialog id="projectDialog"><form id="projectForm" method="dialog"><div class="modal-head"><h2>Novo projeto</h2><button type="button" class="close" data-close>×</button></div><label>Nome do projeto<input id="newProjectName" required maxlength="80" placeholder="Ex.: Meu SaaS"></label><div class="modal-actions"><span></span><button type="button" class="ghost" data-close>Cancelar</button><button value="default">Criar projeto</button></div></form></dialog>
  <dialog id="importDialog"><form id="importForm" method="dialog"><div class="modal-head"><h2>Importar dados</h2><button type="button" class="close" data-close>×</button></div><p id="importInfo"></p><label>Como importar<select id="importMode"><option value="merge">Adicionar aos projetos existentes</option><option value="replace">Substituir todos os dados locais</option></select></label><div class="modal-actions"><span></span><button type="button" class="ghost" data-close>Cancelar</button><button value="default">Importar</button></div></form></dialog>
  <dialog id="promptDialog"><form method="dialog"><div class="modal-head"><h2>Prompt para IA</h2><button type="button" class="close" data-close>×</button></div><p class="prompt-note">Edite livremente esta prévia. Itens já concluídos não são incluídos.</p><textarea id="promptPreview" rows="16"></textarea><div class="modal-actions"><span></span><button type="button" class="ghost" data-close>Fechar</button><button type="button" id="copyPromptBtn">Copiar prompt</button></div></form></dialog>
  <div id="toast" role="status"></div><div id="helpTooltip" role="tooltip" hidden></div><script src="app.js"></script>
</body></html>
